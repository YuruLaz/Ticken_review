<nav id="views" class="pane views" hx-boost="true" {% if oob %}hx-swap-oob="true"{% endif %}>
  <h2>Views</h2>
  {% for name, label, status in views %}
    <a class="view {{ 'active' if name == view }}" href="/inbox?view={{ name }}">
      {{ label }}
      <span class="count">{{ total if status is none else counts.get(status, 0) }}</span>
    </a>
    {% if name == "escalated" %}<hr>{% endif %}
  {% endfor %}
</nav>
