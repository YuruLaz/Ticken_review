<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SupportDesk{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="https://unpkg.com/htmx.org@2" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">ShopNest <span>Support</span></a>
    {% if user %}
      <div class="who">
        {% if user.role == "admin" %}<a href="/inbox">Inbox</a> <a href="/admin">Dashboard</a> <a href="/admin/kb">Knowledge base</a>{% endif %}
        {{ user.full_name }} <span class="chip">{{ user.role }}</span>
        <form method="post" action="/logout"><button class="link">Log out</button></form>
      </div>
    {% endif %}
  </header>
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
