{% extends "base.html" %}
{% block title %}Inbox · SupportDesk{% endblock %}
{% block main_class %}inbox{% endblock %}

{% block content %}
{% include "_views.html" %}

<section class="pane list">
  <form id="filters" onsubmit="return false">
    <input type="hidden" name="view" value="{{ view }}">
    <input type="search" name="q" value="{{ q }}" placeholder="Search subject or message…"
           hx-get="/inbox/list" hx-include="#filters" hx-target="#list"
           hx-trigger="input changed delay:300ms, search">
  </form>
  <div id="list" hx-get="/inbox/list" hx-include="#filters" hx-trigger="every 20s, ticketsChanged from:body">
    {% include "_ticket_list.html" %}
  </div>
</section>

<section class="pane workspace" id="workspace">
  <p class="empty">Select a ticket</p>
</section>
{% endblock %}
